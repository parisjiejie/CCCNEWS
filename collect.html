{% extends "base.html" %}
{% block title %}新闻采集{% endblock %}
{% block content %}
<h1 class="page-title">新闻采集</h1>

<div style="display: grid; gap: 20px;">
  <!-- Search -->
  <div class="card">
    <h3 style="font-size: 16px; margin-bottom: 8px;">&#128269; 搜索采集</h3>
    <p style="font-size: 13px; color: #666; margin-bottom: 12px;">
      输入关键词搜索中国科技资讯，或使用预设标签快速搜索。
    </p>
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
      <input type="text" id="searchQuery" class="form-control" placeholder="输入搜索关键词..." style="flex: 1;">
      <button class="btn btn-primary" onclick="doSearch()" id="searchBtn">搜索采集</button>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;">
      {% for kw in preset_keywords %}
      <button type="button" class="btn btn-sm btn-secondary" onclick="doSearch('{{ kw }}')">{{ kw }}</button>
      {% endfor %}
    </div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <button class="btn btn-success" onclick="doAutoCollect()" id="autoBtn">一键采集（全部关键词）</button>
      <div class="spinner" id="collectSpinner"></div>
      <span id="collectStatus" style="font-size: 13px; color: #666;"></span>
    </div>
  </div>

  <!-- Search Results (dynamic) -->
  <div class="card" id="resultsCard" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="font-size: 16px;">搜索结果</h3>
      <div style="display: flex; gap: 8px; align-items: center;">
        <span id="resultCount" style="font-size: 12px; color: #888;"></span>
        <button class="btn btn-sm btn-primary" onclick="importSelected()" id="importBtn">导入选中文章</button>
      </div>
    </div>
    <div id="resultsList"></div>
  </div>

  <!-- Manual Add -->
  <div class="card">
    <h3 style="font-size: 16px; margin-bottom: 12px;">&#9997; 手动添加</h3>
    <form method="POST" action="{{ url_for('collect_manual') }}">
      <div class="form-group">
        <label>标题</label>
        <input type="text" name="title" class="form-control" required>
      </div>
      <div class="form-group">
        <label>分类</label>
        <select name="category" class="form-control" required>
          <option value="">请选择分类</option>
          {% for cat in categories %}
          <option value="{{ cat }}">{{ cat }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>摘要</label>
        <textarea name="summary" class="form-control" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>正文</label>
        <textarea name="content" class="form-control" rows="5"></textarea>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label>来源名称</label>
          <input type="text" name="source" class="form-control">
        </div>
        <div class="form-group">
          <label>来源链接</label>
          <input type="url" name="source_url" class="form-control" placeholder="https://">
        </div>
      </div>
      <button type="submit" class="btn btn-primary">添加文章</button>
    </form>
  </div>
</div>

<script>
var searchResults = [];

function setStatus(msg, type) {
  var el = document.getElementById('collectStatus');
  el.textContent = msg;
  el.style.color = type === 'error' ? '#dc3545' : type === 'success' ? '#28a745' : '#666';
}

function doSearch(keyword) {
  var query = keyword || document.getElementById('searchQuery').value.trim();
  if (!query) { alert('请输入搜索关键词'); return; }
  document.getElementById('searchQuery').value = query;

  var btn = document.getElementById('searchBtn');
  var spinner = document.getElementById('collectSpinner');
  btn.disabled = true;
  btn.textContent = '搜索中...';
  spinner.classList.add('active');
  setStatus('正在搜索"' + query + '"...', 'info');

  fetch('/api/collect/search', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({query: query})
  })
  .then(r => r.json())
  .then(data => {
    btn.disabled = false;
    btn.textContent = '搜索采集';
    spinner.classList.remove('active');

    if (data.success && data.results.length > 0) {
      searchResults = data.results;
      renderResults(data.results);
      setStatus('找到 ' + data.count + ' 条结果', 'success');
    } else {
      setStatus('未找到结果，请尝试其他关键词', 'error');
      document.getElementById('resultsCard').style.display = 'none';
    }
  })
  .catch(e => {
    btn.disabled = false;
    btn.textContent = '搜索采集';
    spinner.classList.remove('active');
    setStatus('搜索失败: ' + e.message, 'error');
  });
}

function doAutoCollect() {
  var btn = document.getElementById('autoBtn');
  var spinner = document.getElementById('collectSpinner');
  btn.disabled = true;
  btn.textContent = '采集中...';
  spinner.classList.add('active');
  setStatus('正在通过AI采集新闻，预计15-30秒...', 'info');

  fetch('/api/collect/auto', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'}
  })
  .then(r => r.json())
  .then(data => {
    btn.disabled = false;
    btn.textContent = '一键采集（全部关键词）';
    spinner.classList.remove('active');

    if (data.success) {
      setStatus(data.message, 'success');
      if (data.added > 0) {
        showFlash(data.message, 'success');
      }
    } else {
      setStatus('采集失败: ' + (data.error || '未知错误'), 'error');
    }
  })
  .catch(e => {
    btn.disabled = false;
    btn.textContent = '一键采集（全部关键词）';
    spinner.classList.remove('active');
    setStatus('请求失败: ' + e.message, 'error');
  });
}

function renderResults(results) {
  var card = document.getElementById('resultsCard');
  var list = document.getElementById('resultsList');
  var count = document.getElementById('resultCount');
  card.style.display = 'block';
  count.textContent = '找到 ' + results.length + ' 条';

  var html = '';
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    html += '<div style="display:flex;gap:10px;padding:12px;background:#FAF7F2;border-radius:8px;margin-bottom:8px;align-items:flex-start;">';
    html += '<input type="checkbox" class="result-check" data-idx="' + i + '" checked style="margin-top:4px;width:18px;height:18px;accent-color:#8B2252;">';
    html += '<div style="flex:1;">';
    html += '<div style="font-weight:500;font-size:14px;margin-bottom:4px;">' + escapeHtml(r.title) + '</div>';
    if (r.snippet) {
      html += '<div style="font-size:13px;color:#666;margin-bottom:4px;">' + escapeHtml(r.snippet.substring(0, 200)) + '</div>';
    }
    html += '<div style="font-size:11px;color:#999;">';
    if (r.source) html += escapeHtml(r.source) + ' | ';
    html += '<span class="badge badge-cat-' + (i % 5) + '">' + escapeHtml(r.category || '') + '</span>';
    html += '</div></div></div>';
  }
  list.innerHTML = html;
}

function importSelected() {
  var checks = document.querySelectorAll('.result-check:checked');
  if (checks.length === 0) { alert('请勾选要导入的文章'); return; }

  var items = [];
  checks.forEach(function(cb) {
    var idx = parseInt(cb.getAttribute('data-idx'));
    if (searchResults[idx]) items.push(searchResults[idx]);
  });

  var btn = document.getElementById('importBtn');
  btn.disabled = true;
  btn.textContent = '导入中...';

  fetch('/api/collect/import', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({items: items})
  })
  .then(r => r.json())
  .then(data => {
    btn.disabled = false;
    btn.textContent = '导入选中文章';
    if (data.success) {
      showFlash(data.message, 'success');
      document.getElementById('resultsCard').style.display = 'none';
    } else {
      alert('导入失败: ' + (data.error || '未知错误'));
    }
  })
  .catch(e => {
    btn.disabled = false;
    btn.textContent = '导入选中文章';
    alert('请求失败: ' + e.message);
  });
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showFlash(msg, type) {
  var container = document.getElementById('flashContainer');
  if (!container) {
    container = document.createElement('div');
    container.id = 'flashContainer';
    container.className = 'flash-container';
    document.body.appendChild(container);
  }
  var el = document.createElement('div');
  el.className = 'flash-msg ' + type;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(function() { el.remove(); }, 5000);
}

// Enter key triggers search
document.getElementById('searchQuery').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
});
</script>
{% endblock %}
